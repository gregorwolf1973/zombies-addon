name: Add-on bauen

on:
  push:
    branches: [main]
    paths:
      - "zombies/**"
      - ".github/workflows/builder.yaml"
  pull_request:
    paths:
      - "zombies/**"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }} bauen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Ohne dieses Recht darf der Lauf nichts in die GitHub-Registrierung
      # schieben - der Push scheitert dann mit "denied".
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      # Aus einem Pull Request heraus wird nur gebaut, nicht veroeffentlicht.
      - name: Nur bauen (Pull Request)
        if: github.event_name == 'pull_request'
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/zombies \
            --image {arch}-addon-zombies \
            --docker-hub ghcr.io/${{ github.repository_owner }}

      - name: An der GitHub-Registrierung anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und veroeffentlichen
        if: github.event_name != 'pull_request'
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/zombies \
            --image {arch}-addon-zombies \
            --docker-hub ghcr.io/${{ github.repository_owner }}
