name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Lint und Schnelltests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zombies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zombies/package-lock.json
      - run: npm ci
      - run: npm run lint
      # nacheinander: GitHub-Runner haben nur 2 Kerne, parallele Testdateien verfälschen die Zeitmessungen
      - run: node --test --test-concurrency=1 $(cat tests/schnell.txt)
