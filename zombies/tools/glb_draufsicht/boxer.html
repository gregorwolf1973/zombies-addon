<!doctype html><html><body style="margin:0;background:#0000">
<pre id="out">LAEUFT</pre>
<script type="importmap">{"imports":{"three":"./lib/three/three.module.js","three/addons/":"./lib/three/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const out = document.getElementById('out');
const q = new URLSearchParams(location.search);
const PX = +(q.get('px') || 8);          // Bildpunkte je Modelleinheit
const TURM = q.get('turm') ? q.get('turm').split(',') : ['turret', 'gun', 'rocket00', 'rocket01', 'spike_lr'];   // Knotennamen des Turms (?turm=a,b)
const NICHT = q.get('weg') ? q.get('weg').split(',') : [];   // Knoten ausblenden (?weg=a,b)
const AB = k => q.get(k) === null ? null : +q.get(k);
const FILTER = { y0: AB('y0'), y1: AB('y1'), z0: AB('z0'), z1: AB('z1'), x0: AB('x0'), x1: AB('x1') };   // Dreiecke behalten, deren Schwerpunkt im Bereich liegt (Modellkoordinaten)
const MESHES = q.get('meshes') ? q.get('meshes').split(',') : null;   // nur diese Meshes (Object_4,…)
const INV = q.get('inv') === '1';   // Filter umkehren (alles außer dem Bereich)
const ANSICHT = q.get('ansicht') || 'oben';                                // oben | seite | vorn
const DREH = (+(q.get('drehung') || 0)) * Math.PI / 180;     // Modell um die Hochachse drehen (Grad), falls der Bug nicht nach rechts zeigt
try {
  const g = await new GLTFLoader().loadAsync(q.get('datei') || 'spz_puma.glb');
  const root = g.scene; root.rotation.y = DREH; root.updateMatrixWorld(true);
  const box = o => new THREE.Box3().setFromObject(o);
  const fmt = b => [b.min, b.max].map(v => [v.x, v.y, v.z].map(n => n.toFixed(2)).join(',')).join(' .. ');
  const info = ['GESAMT ' + fmt(box(root))];
  root.traverse(o => { if (o.isMesh) { if (q.get('alle')) { const k = []; for (let p = o.parent; p && p !== root; p = p.parent) k.push(p.name); info.push('MESH ' + o.name + ' <' + k.join('<') + '> ' + fmt(box(o))); } return; } const b = box(o); if (!b.isEmpty() && o.name && (q.get('alle') || !o.name.includes('#'))) info.push(o.name + ' <' + (o.parent?.name || '') + '> ' + fmt(b)); });
  for (const n of ['turret','gun_rot','gun', ...(q.get('turm') ? q.get('turm').split(',') : []), 'Axe_Canon_01']) { const o = root.getObjectByName(n); if (o) { const v = o.getWorldPosition(new THREE.Vector3()); info.push('URSPRUNG ' + n + ' ' + [v.x,v.y,v.z].map(z=>z.toFixed(2)).join(',')); } }
  if (q.get('nur') === 'info') { out.textContent = info.join('\n'); throw 0; }
  // Teile auswählen: wanne = alles ohne Turm, turm = nur Turm
  const teil = 'alles';
  const istTurm = () => false;
  const istWeg = o => { for (let p = o; p; p = p.parent) if (NICHT.includes(p.name)) return true; return false; };
  const neu = [];
  root.traverse(o => { if (!o.isMesh) return; if (MESHES && !MESHES.includes(o.name)) { o.visible = false; return; }
    const g0 = o.geometry, pos = g0.attributes.position, idx = g0.index, n = idx ? idx.count : pos.count, v = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()], keep = [];
    for (let i = 0; i < n; i += 3) {
      for (let k = 0; k < 3; k++) v[k].fromBufferAttribute(pos, idx ? idx.getX(i + k) : i + k).applyMatrix4(o.matrixWorld);
      const c = v[0].clone().add(v[1]).add(v[2]).multiplyScalar(1 / 3);
      const ok = (a, lo, hi) => (lo === null || a >= lo) && (hi === null || a <= hi);
      if ((ok(c.y, FILTER.y0, FILTER.y1) && ok(c.z, FILTER.z0, FILTER.z1) && ok(c.x, FILTER.x0, FILTER.x1)) !== INV) for (let k = 0; k < 3; k++) keep.push(idx ? idx.getX(i + k) : i + k);
    }
    o.visible = keep.length > 0; if (keep.length) { const g = g0.clone(); g.setIndex(keep); g.computeBoundingBox(); o.geometry = g; }
  });
  
  const b = new THREE.Box3(); root.traverse(o => { if (o.isMesh && o.visible) b.expandByObject(o); });
  // Ansichten (nach der Drehung, Koordinaten der Filter = Weltkoordinaten nach ?drehung=90: x = Längsachse, Bug +x): oben = x rechts, z unten; seite = x rechts, y oben
  const cx = (b.min.x + b.max.x) / 2, cy = (b.min.y + b.max.y) / 2, cz = (b.min.z + b.max.z) / 2;
  const ausd = ANSICHT === 'oben' ? [b.max.x - b.min.x, b.max.z - b.min.z] : [b.max.x - b.min.x, b.max.y - b.min.y];
  const w = Math.ceil(ausd[0] * PX) + 4, h = Math.ceil(ausd[1] * PX) + 4;
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(w, h); r.setClearColor(0x000000, 0); r.outputColorSpace = THREE.SRGBColorSpace;
  const hw = w / PX / 2, hh = h / PX / 2;
  const cam = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.1, 1000);
  if (ANSICHT === 'oben') { cam.position.set(cx, b.max.y + 50, cz); cam.up.set(0, 0, -1); cam.lookAt(cx, b.min.y, cz); }
  else {   // seite: Blick von der rechten Fahrzeugseite, Bug nach rechts
    cam.position.set(cx, cy, b.max.z + 50); cam.up.set(0, 1, 0); cam.lookAt(cx, cy, cz); }
  const sz = new THREE.Scene(); sz.add(root);
  sz.add(new THREE.AmbientLight(0xffffff, 1.2));
  const sonne = new THREE.DirectionalLight(0xffffff, 2.2); sonne.position.set(cx - 20, b.max.y + 60, cz - 30); sonne.target.position.set(cx, 0, cz); sz.add(sonne, sonne.target);
  r.render(sz, cam);
  out.textContent = 'BILD ' + JSON.stringify({ w, h, min: b.min, max: b.max, px: PX }) + '\n' + r.domElement.toDataURL('image/png');
} catch (e) { if (e !== 0) out.textContent = 'FEHLER ' + (e && e.stack || e); }
</script></body></html>
