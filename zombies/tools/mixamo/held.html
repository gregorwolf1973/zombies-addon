<!doctype html><html><body style="margin:0;background:#0000">
<pre id="out">LAEUFT</pre>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<script type="module">

  }
  const sz = new THREE.Scene();
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setClearColor(0x000000, 0); r.outputColorSpace = THREE.SRGBColorSpace;
  sz.add(new THREE.HemisphereLight(0xfff4e0, 0x8a8a78, 1.6));
  const sonne = new THREE.DirectionalLight(0xfff0d8, 2.4); sz.add(sonne, sonne.target);
  const S = GROSS;   // Waffen wie die Figur übergroß (Weltmaß = Meter × GROSS)

  if (q.get('waffen')) {
    // ===== Waffen-Sprites: je Waffe ein Streifenbild von oben (Mitte der Waffe im Bild, +x = Mündung), dazu Seitenansicht zur Prüfung
    const namen = (q.get('nur') || Object.keys(cfg.waffen).join(',')).split(',').filter(Boolean), CW = 360, CH = 120;
    const sheet = document.createElement('canvas'); sheet.width = CW; sheet.height = CH * namen.length; const sc = sheet.getContext('2d');
    const seite = document.createElement('canvas'); seite.width = CW; seite.height = CH * namen.length; const sc2 = seite.getContext('2d');
    r.setSize(CW, CH); const infos = [];
    for (let i = 0; i < namen.length; i++) {
      const W = await waffe(namen[i]); const holder = new THREE.Group(); holder.scale.setScalar(S); holder.add(W.obj); sz.add(holder);
      const mx = (0.5 - W.w.griff) * W.w.laenge * S;   // Waffenmitte in x (Griff = Ursprung)
      const cam = new THREE.OrthographicCamera(-CW / PX / 2, CW / PX / 2, CH / PX / 2, -CH / PX / 2, 0.1, 100);
      cam.position.set(mx, 20, 0); cam.up.set(0, 0, -1); cam.lookAt(mx, 0, 0); sonne.position.set(mx - 6, 12, -8); sonne.target.position.set(mx, 0, 0);
      r.render(sz, cam); sc.drawImage(r.domElement, 0, i * CH);
      cam.position.set(mx, 0, 20); cam.up.set(0, 1, 0); cam.lookAt(mx, 0, 0); r.render(sz, cam); sc2.drawImage(r.domElement, 0, i * CH);

    }
    out.textContent = 'FERTIG\nWAFFEN ' + JSON.stringify({ CW, CH, PX, S, infos }) + '\n' + sheet.toDataURL('image/png') + '\n' + seite.toDataURL('image/png');
  } else {
  const F = cfg.figuren[q.get('fig')];
  // --- Figur
  const g = await new FBXLoader().loadAsync('fbx/' + F.skin);
  const texte = []; g.traverse(o => { if (o.isMesh) { const ms = [].concat(o.material); ms.forEach(m => { if (m.specular) { m.specular.set(0x1a1a1a); m.shininess = 8; } for (const k of ['map', 'normalMap', 'specularMap']) if (m[k]) texte.push(m[k]); }); } });
  for (let i = 0; i < 200 && !texte.every(t => t.image && (t.image.width || t.image.naturalWidth)); i++) await sleep(100);

  g.animations = [];
  for (const n of F.ausblenden || []) { const l = []; g.traverse(o => { if (o.name === n) l.push(o); }); l.forEach(o => o.parent.remove(o)); }   // fest eingebaute Waffen der Figur (Brute: Streitaxt) entfernen
  const bone = re => { let b; g.traverse(o => { if (o.isBone && !b && re.test(o.name)) b = o; }); return b; };
  const bL = bone(/LeftUpLeg$/i), bR = bone(/RightUpLeg$/i), hand = bone(/RightHand$/i), handL = bone(/LeftHand$/i), fore = bone(/RightForeArm$/i), foreL = bone(/LeftForeArm$/i), kn = bone(/RightHandMiddle1$/i), armL = bone(/LeftArm$/i), armR = bone(/RightArm$/i), knL = bone(/LeftHandMiddle1$/i);
  if (!armL || !armR || !bL || !bR || !hand || !handL || !fore || !foreL || !kn || !knL) throw new Error('Knochen fehlen');
  const vec = o => o.getWorldPosition(new THREE.Vector3());
  // Höhe roh (Meter bei Maßstab 0,01 in der Bindepose) -> Skalierung auf Zielhöhe (cm, Standard 180)
  g.scale.setScalar(0.01); g.updateMatrixWorld(true);

  const rohHoehe = bb0.max.y - bb0.min.y, ZIEL = (F.hoehe || 180) / 100;
  if (q.get('info')) { out.textContent = 'FERTIG\nINFO ' + JSON.stringify({ fig: q.get('fig'), rohHoehe: +rohHoehe.toFixed(3), breite: +(bb0.max.x - bb0.min.x).toFixed(3), tiefe: +(bb0.max.z - bb0.min.z).toFixed(3), knochen0: bL.name, ziel: ZIEL, meshes: (() => { const l = []; g.traverse(o => { if (o.isMesh) { const b = new THREE.Box3().setFromObject(o, true), z = b.getSize(new THREE.Vector3()); l.push([o.name, +z.x.toFixed(2), +z.y.toFixed(2), +z.z.toFixed(2)]); } }); return l; })() }) + '\n'; throw 'info'; }

  g.scale.setScalar(SK);
  sz.add(g);
  // --- Clip laden (Texturen ignorieren, spart Zeit)
  const TL = THREE.TextureLoader.prototype.load;
  async function clipLaden(pfad) {
    THREE.TextureLoader.prototype.load = function () { return new THREE.Texture(); };
    try { const c = await new FBXLoader().loadAsync('fbx/' + pfad); return [...c.animations].sort((x, y) => y.duration - x.duration)[0]; }   // manche Dateien (Remy) tragen zusätzlich eine leere Animation: die längste nehmen
     finally { THREE.TextureLoader.prototype.load = TL; }
  }
  const mixer = new THREE.AnimationMixer(g);
  const box = () => { g.updateMatrixWorld(true); const b = new THREE.Box3(); g.traverse(o => { if (o.isSkinnedMesh) { o.frustumCulled = false; o.skeleton.update(); b.union(new THREE.Box3().setFromObject(o, true)); } }); return b; };
  const nur = (q.get('nur') || '').split(',').filter(Boolean);
  const jobopt = q.get('jobopt') ? JSON.parse(q.get('jobopt')) : {};   // Debug: Auftragswerte überschreiben, z. B. {"faust_schlagen":{"richtung":"sch","rr":0.4}}
  for (const job0 of cfg.auftraege) {
    const job = Object.assign({}, job0, jobopt[job0.name] || {});
    if (nur.length && !nur.includes(job.name)) continue;
    const t0 = performance.now(); const N = +q.get('nn') || job.n || N0;
    const clip = await clipLaden((F.ersatz && F.ersatz[job.name] || job.clip).replace('{o}', F.o));
    const pre = bL.name.match(/^mixamorig\d*/)[0]; for (const t of clip.tracks) t.name = t.name.replace(/^mixamorig\d*/, pre);   // Rigs mit anderem Präfix (mixamorig1) bedienen
    let wegM = 0; for (const t of clip.tracks) if (/Hips\.position$/.test(t.name)) { const v = t.values, n = v.length - 3; wegM = Math.hypot(v[n] - v[0], v[n + 2] - v[2]) * SK; }   // Hüftweg über den Clip (m, mit Übergröße) = Weg je Schrittzyklus
    for (const t of clip.tracks) if (/Hips\.position$/.test(t.name)) { const v = t.values; const x0 = v[0], z0 = v[2]; for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; } }

    const EINMAL = !!job.einmal, dauer = clip.duration, VON = job.von || 0, TZ = i => EINMAL ? dauer * (VON + (ANT - VON) * Math.min(i, N - 1) / (N - 1)) : dauer * i / N;
    // Blickrichtung: Standard Hüfte (Schleifen über 16 Phasen, sonst Bild 0); richtung = 'lr' | 'fa' (Ziel-/Schlagrichtung aus den Armen bei Zeit rr) für bewaffnete Haltungen

    const gier = Math.atan2(fx, fz); g.rotation.y = Math.PI / 2 - gier + (job.dreh || 0) * Math.PI / 180;
    // Waffen an die Hand hängen (unsichtbar, nur für die Poseberechnung; Debug mitwaffe = sichtbar)

    for (const wn of (job.waffen || [])) {

      const links = w.hand === 'L', hb = links ? handL : hand, fb = links ? foreL : fore, kb = links ? knL : kn;
      const tref = (job.ref || 0) * dauer; mixer.setTime(tref); g.updateMatrixWorld(true);
      const pR = vec(hand), pL = vec(handL), pF = vec(fb), pK = vec(kb), pH = vec(hb);
      let d;
      if (w.modus === 'lr') d = pL.clone().sub(pR); else if (w.modus === 'fa') d = pH.clone().sub(pF); else d = new THREE.Vector3(...w.vec);

      d.applyAxisAngle(new THREE.Vector3(0, 1, 0), (w.yaw || 0) * Math.PI / 180);
      const quer = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), d).normalize(); d.applyAxisAngle(quer, -(w.pitch || 0) * Math.PI / 180);
      let up = new THREE.Vector3(0, 1, 0); up.sub(d.clone().multiplyScalar(up.dot(d))).normalize();
      if (w.hochvec) { up = new THREE.Vector3(...w.hochvec); up.sub(d.clone().multiplyScalar(up.dot(d))).normalize(); }

    r.setSize(Wpx, Wpx);
    mixer.setTime(0); const b0 = box(); const cx = (b0.min.x + b0.max.x) / 2 + (job.vx !== undefined ? job.vx : 0), cz = (b0.min.z + b0.max.z) / 2, y0 = b0.min.y;
    const cam = new THREE.OrthographicCamera(-h, h, h, -h, 0.1, 1000); const ans = q.get('ansicht') || 'oben';
    if (ans === 'oben') { cam.position.set(cx, y0 + 20, cz); cam.up.set(0, 0, -1); cam.lookAt(cx, y0 + 1, cz); }
    else if (ans === 'seite') { cam.position.set(cx, y0 + 1.1 * GROSS, cz + 20); cam.up.set(0, 1, 0); cam.lookAt(cx, y0 + 1.1 * GROSS, cz); }
    else { cam.position.set(cx + 20, y0 + 1.1 * GROSS, cz); cam.up.set(0, 1, 0); cam.lookAt(cx, y0 + 1.1 * GROSS, cz); }

        pos[hh.wn].push([+((p0.x - cx) * PXJ).toFixed(1), +((p0.z - cz) * PXJ).toFixed(1), +Math.atan2(dv.z, dv.x).toFixed(3), +(Math.hypot(dv.x, dv.z) / len).toFixed(3), +(uv.y / len).toFixed(2)]);
      }

  }

  }
} catch (e) { if (e !== 'info') out.textContent = 'FEHLER ' + (e && e.stack || e) + '\n' + ergebnis.join('\n'); }
