configuration:
  externe_adresse:
    name: "Externe Adresse (https)"
    description: "Öffentliche https-Adresse, unter der das Spiel erreichbar ist – nötig für Mikrofon/Sprachfunk bei Zugriff von außen. Alle anderen Einstellungen (Karte, Zombies, Zugangscode, Wiki-Adresse …) gibt es auf der Einstellungsseite des Spiels (Seitenleiste)."
  stun_server:
    name: "STUN-Server"
    description: "Für den Sprachfunk. Der Standard fragt einen Google-Server (IP-Adressen gehen dorthin); leer lassen schaltet ihn ab."
  turn_server:
    name: "TURN-Server"
    description: "Optional: eigener TURN-Server (Relais) für Sprachfunk hinter strengen Firewalls/NATs."
  turn_username:
    name: "TURN-Benutzer"
    description: "Benutzername für den TURN-Server."
  turn_password:
    name: "TURN-Passwort"
    description: "Passwort für den TURN-Server."
