configuration:
  externe_adresse:
    name: "External address (https)"
    description: "Public https address the game is reachable at – needed for the microphone/voice chat from outside. All other settings (map, zombies, access code, wiki address …) are on the game's settings page (sidebar)."
  stun_server:
    name: "STUN server"
    description: "For voice chat. The default asks a Google server (IP addresses are sent there); leave empty to disable it."
  turn_server:
    name: "TURN server"
    description: "Optional: your own TURN server (relay) for voice chat behind strict firewalls/NATs."
  turn_username:
    name: "TURN user"
    description: "User name for the TURN server."
  turn_password:
    name: "TURN password"
    description: "Password for the TURN server."
